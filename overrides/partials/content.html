{{ super() }}

<div class="share-buttons" style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--md-default-fg-color--lightest);">
  <p style="font-weight: 600; font-size: 0.9rem; margin-bottom: 0.75rem; color: var(--md-default-fg-color--light);">
    Comparte este capítulo
  </p>
  <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
    <button class="share-btn share-twitter" type="button" aria-label="Compartir en Twitter">
      𝕏 Twitter
    </button>
    <button class="share-btn share-linkedin" type="button" aria-label="Compartir en LinkedIn">
      💼 LinkedIn
    </button>
    <button class="share-btn share-whatsapp" type="button" aria-label="Compartir en WhatsApp">
      💬 WhatsApp
    </button>
    <button class="share-btn share-reddit" type="button" aria-label="Compartir en Reddit">
      👽 Reddit
    </button>
    <button class="share-btn share-email" type="button" aria-label="Compartir por email">
      📧 Email
    </button>
    <button class="share-btn share-copy" type="button" aria-label="Copiar enlace">
      🔗 Copiar enlace
    </button>
  </div>
</div>

<script>
(function () {
  function initShareButtons() {
    var shareBox = document.querySelector('.share-buttons');
    if (!shareBox || shareBox.dataset.init === 'true') return;
    shareBox.dataset.init = 'true';

    var url = encodeURIComponent(window.location.href);
    var title = encodeURIComponent(document.title);
    var text = encodeURIComponent('Mira este capítulo del Libro del Desarrollador Web: ' + document.title);

    var buttons = {
      '.share-twitter':  'https://twitter.com/intent/tweet?text=' + text + '&url=' + url,
      '.share-linkedin': 'https://www.linkedin.com/sharing/share-offsite/?url=' + url,
      '.share-whatsapp': 'https://api.whatsapp.com/send?text=' + text + '%20' + url,
      '.share-reddit':   'https://www.reddit.com/submit?url=' + url + '&title=' + title,
      '.share-email':    'mailto:?subject=' + title + '&body=' + text + '%20' + url
    };

    Object.keys(buttons).forEach(function (selector) {
      var btn = shareBox.querySelector(selector);
      if (btn) {
        btn.addEventListener('click', function () {
          window.open(buttons[selector], '_blank', 'noopener,noreferrer,width=600,height=500');
        });
      }
    });

    var copyBtn = shareBox.querySelector('.share-copy');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        navigator.clipboard.writeText(window.location.href).then(function () {
          var original = copyBtn.textContent;
          copyBtn.textContent = '✅ Copiado';
          copyBtn.classList.add('copied');
          setTimeout(function () {
            copyBtn.textContent = original;
            copyBtn.classList.remove('copied');
          }, 2000);
        });
      });
    }
  }

  if (typeof document$ !== 'undefined') {
    document$.subscribe(initShareButtons);
  } else {
    document.addEventListener('DOMContentLoaded', initShareButtons);
  }
})();
</script>

<style>
.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.5rem 0.9rem;
  border: 1px solid var(--md-default-fg-color--lightest);
  background: var(--md-default-bg-color);
  color: var(--md-default-fg-color);
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 150ms ease-out;
  font-family: inherit;
}

.share-btn:hover {
  background: var(--md-primary-fg-color);
  color: white;
  border-color: var(--md-primary-fg-color);
  transform: translateY(-2px);
}

.share-btn:focus-visible {
  outline: 3px solid var(--md-accent-fg-color);
  outline-offset: 2px;
}

.share-btn.copied {
  background: #16a34a;
  color: white;
  border-color: #16a34a;
}
</style>
