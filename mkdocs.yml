site_name: Libro del Desarrollador Web — Urukais
site_description: "Material completo para aprender desarrollo web desde cero: HTML, CSS, JavaScript y más."
site_author: Manuel Casimiro Carrasco (Urukais)
site_url: https://libro.urukais.com/
repo_name: urukaisk-maker/Libro-desarrollador-Web-Urukais-
repo_url: https://github.com/urukaisk-maker/Libro-desarrollador-Web-Urukais-

theme:
  name: material
  language: es
  custom_dir: overrides
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.integrate
  palette:
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

nav:
  - Inicio: index.md
  - Filosofía: filosofia.md
  - Introducción: introduccion.md
  - Nivel principiante:
      - "01 — Introducción al desarrollo web": capitulos/01-introduccion.md
      - "02 — HTML básico": capitulos/02-html-basico.md
      - "03 — CSS básico": capitulos/03-css-basico.md
      - "04 — JavaScript esencial": capitulos/04-javascript.md
      - "05 — Diseño responsive": capitulos/05-responsive.md
      - "06 — Formularios HTML": capitulos/06-formularios.md
  - Nivel intermedio:
      - "07 — Git y control de versiones": capitulos/07-git.md
      - "08 — Consumo de APIs con fetch": capitulos/08-apis.md
      - "09 — Despliegue y hosting": capitulos/09-despliegue.md
      - "10 — Proyecto final: portfolio": capitulos/10-proyecto-final.md
  - Nivel avanzado:
      - "11 — CSS moderno": capitulos/11-css-moderno.md
      - "12 — JavaScript asíncrono": capitulos/12-javascript-asincrono.md
      - "13 — Módulos y bundlers": capitulos/13-modulos-bundlers.md
      - "14 — Accesibilidad web": capitulos/14-accesibilidad.md
      - "15 — TypeScript desde cero": capitulos/15-typescript.md
      - "16 — Testing frontend": capitulos/16-testing.md
      - "17 — Rendimiento web": capitulos/17-rendimiento.md
      - "18 — Arquitectura frontend": capitulos/18-arquitectura.md
  - Nivel profesional:
      - "19 — Full-stack con Node.js": capitulos/19-fullstack-node.md
      - "20 — DevOps para frontend": capitulos/20-devops.md
  - Nivel experto:
      - "21 — Web Components": capitulos/21-web-components.md
      - "22 — Progressive Web Apps (PWA)": capitulos/22-pwa.md
      - "23 — WebSockets y tiempo real": capitulos/23-websockets.md
      - "24 — Animaciones avanzadas": capitulos/24-animaciones.md
      - "25 — Design systems": capitulos/25-design-systems.md
  - Nivel élite:
      - "26 — Seguridad web": capitulos/26-seguridad.md
      - "27 — WebAssembly": capitulos/27-webassembly.md
      - "28 — IA en el frontend": capitulos/28-ia-frontend.md
      - "29 — WebXR": capitulos/29-webxr.md
      - "30 — Web3": capitulos/30-web3.md
  - Ejemplos: ejemplos/index.md
  - Ejercicios resueltos:
      - Índice: ejercicios/index.md
      - "01 — Introducción": ejercicios/01-introduccion.md
      - "02 — HTML básico": ejercicios/02-html-basico.md
      - "03 — CSS básico": ejercicios/03-css-basico.md
      - "04 — JavaScript": ejercicios/04-javascript.md
