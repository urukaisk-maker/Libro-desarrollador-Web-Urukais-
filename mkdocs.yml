  - Apéndices:
      - Índice: apendices/index.md
      - Chuletas rápidas: apendices/chuletas.md
      - Glosario: apendices/glosario.md
      - Recursos por nivel: apendices/recursos-por-nivel.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js
extra:
  generator: false
  comments: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/urukaisk-maker
      name: GitHub de Urukais
    - icon: fontawesome/solid/globe
      link: https://silly-boba-dc057e.netlify.app/
      name: Portfolio de Urukais
  analytics:
    provider: google
    property: G-61PDYH5BZN

copyright: © 2026 Manuel Casimiro Carrasco — Urukais
