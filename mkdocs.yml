plugins:
  - search

  - i18n:
      languages:
        - locale: es
          name: Español
          default: true
        - locale: en
          name: English

  - mkdocs-video

  - optimize:
      enabled: !ENV [CI, false]

  - social:
      enabled: !ENV [CI, false]
      cards: true
      cards_layout_options:
        background_color: "#1a1a2e"
        color: "#ffffff"

  - meta

  # ⚠️ print-site debe ser SIEMPRE el último plugin
  - print-site:
      add_to_navigation: true
      print_page_title: 'Versión imprimible'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/css/share.css
  - assets/css/custom.css
  - https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js
  - javascripts/quiz.js
  - javascripts/logros.js
  - javascripts/external-links.js
  - javascripts/music-search.js
  - javascripts/landing.js
  - javascripts/command-palette.js
  - javascripts/reading-progress.js
  - javascripts/theme-toggle.js

extra:
  generator: false
  comments: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/urukaisk-maker
      name: GitHub de Urukais
    - icon: fontawesome/solid/globe
      link: https://silly-boba-dc057e.netlify.app/
      name: Portfolio de Urukais
  analytics:
    provider: google
    property: G-61PDYH5BZN

