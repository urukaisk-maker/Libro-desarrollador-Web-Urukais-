site_name: Libro del Desarrollador Web — Urukais
site_description: "Material completo para aprender desarrollo web desde cero: HTML, CSS, JavaScript y más."
site_author: Manuel Casimiro Carrasco (Urukais)
site_url: https://libro.urukais.com/
repo_name: urukaisk-maker/Libro-desarrollador-Web-Urukais-
repo_url: https://github.com/urukaisk-maker/Libro-desarrollador-Web-Urukais-

theme:
  name: material
  language: es
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  theme:
  name: material
  language: es
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - header.autohide
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tooltips
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

