<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat en tiempo real</title>
  <style>
    body { font-family: system-ui; padding: 2rem; background: #f8fafc; }
    #mensajes { border: 1px solid #ccc; height: 300px; overflow-y: auto; padding: 1rem; background: white; border-radius: 8px; }
    #form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    #input { flex: 1; padding: 0.5rem; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #6a5acd; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Chat en vivo</h1>
  <div id="mensajes"></div>
  <form id="form">
    <input id="input" placeholder="Escribe un mensaje..." autocomplete="off">
    <button>Enviar</button>
  </form>
  <script>
    const socket = new WebSocket('ws://localhost:3000');
    const mensajes = document.getElementById('mensajes');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    socket.onmessage = (e) => {
      const p = document.createElement('p');
      p.textContent = e.data;
      mensajes.appendChild(p);
      mensajes.scrollTop = mensajes.scrollHeight;
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (input.value.trim()) {
        socket.send(input.value);
        input.value = '';
      }
    });
  </script>
</body>
</html>
