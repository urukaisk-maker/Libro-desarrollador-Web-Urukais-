<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capítulo 4 — JavaScript esencial</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #222; }
    h1 { color: #6a5acd; }
    button { background: #6a5acd; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #5b4bc4; }
    .contador { font-size: 2rem; font-weight: bold; color: #0891b2; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>JavaScript en acción</h1>
  <p>Pulsa el botón para ver JavaScript funcionando:</p>
  <button id="btn">Púlsame</button>
  <div class="contador" id="contador">0</div>

  <script>
    let contador = 0;
    const btn = document.getElementById('btn');
    const display = document.getElementById('contador');

    btn.addEventListener('click', () => {
      contador++;
      display.textContent = contador;
    });
  </script>
</body>
</html>
