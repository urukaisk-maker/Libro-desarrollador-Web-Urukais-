name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant libcairo2 libpango-1.0-0 libpangocairo-1.0-0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check ES/EN parity
        run: |
          python3 - <<'PYEOF'
          from pathlib import Path

          docs = Path("docs")
          es = {
              p.relative_to(docs).with_suffix("")
              for p in docs.rglob("*.md")
              if not p.name.endswith(".en.md")
          }
          en = {
              Path(p.as_posix()[:-6]).relative_to(docs)
              for p in docs.rglob("*.en.md")
          }

          missing = sorted(es - en)
          orphans = sorted(en - es)
          assert not missing, f"Missing .en.md for: {missing}"
          assert not orphans, f"Orphan .en.md without base .md: {orphans}"
          print(f"Parity OK: {len(es)} ES/EN pairs.")
          PYEOF

      - name: Build site strictly
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --strict --force