<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capítulo 6 — Formularios</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 3rem auto; padding: 0 1rem; color: #1e293b; }
    h1 { color: #6a5acd; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 0.6rem; margin-top: 0.25rem;
      border: 1px solid #cbd5e1; border-radius: 8px; font: inherit;
    }
    input:focus, textarea:focus { outline: 2px solid #a78bfa; border-color: transparent; }
    button {
      margin-top: 1.25rem; background: #6a5acd; color: #fff;
      border: none; padding: 0.7rem 1.4rem; border-radius: 8px;
      cursor: pointer; font-size: 1rem;
    }
    button:hover { background: #5b4bc4; }
    .resultado { margin-top: 1rem; color: #0891b2; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Formulario de contacto</h1>
  <form id="form">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>

    <button type="submit">Enviar</button>
  </form>
  <div class="resultado" id="resultado"></div>

  <script>
    const form = document.getElementById('form');
    const resultado = document.getElementById('resultado');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const datos = new FormData(form);
      resultado.textContent = `¡Gracias, ${datos.get('nombre')}! Hemos recibido tu mensaje.`;
      form.reset();
    });
  </script>
</body>
</html>
