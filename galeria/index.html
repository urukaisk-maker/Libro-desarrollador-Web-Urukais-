<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Galería — Proyecto Guiado</title>
  <link rel="stylesheet" href="galeria.css">
</head>
<body>

  <header>
    <h1>📸 Mi Galería</h1>
    <p>Haz clic en cualquier imagen para verla en grande.</p>
  </header>

  <main class="galeria">
    <img src="https://picsum.photos/id/1015/400/300" alt="Paisaje de montaña" class="miniatura">
    <img src="https://picsum.photos/id/1016/400/300" alt="Bosque de pinos" class="miniatura">
    <img src="https://picsum.photos/id/1018/400/300" alt="Lago tranquilo" class="miniatura">
    <img src="https://picsum.photos/id/1020/400/300" alt="Oso en la naturaleza" class="miniatura">
    <img src="https://picsum.photos/id/1024/400/300" alt="Ave volando" class="miniatura">
    <img src="https://picsum.photos/id/1039/400/300" alt="Cascada" class="miniatura">
  </main>

  <div id="lightbox" class="lightbox">
    <button id="cerrar" aria-label="Cerrar imagen">×</button>
    <img id="imagen-grande" src="" alt="Imagen ampliada">
  </div>

  <script src="galeria.js"></script>
</body>
</html>
